name: MiGPS
options:
  bundleIdPrefix: com.dupratfrancisco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MiGPS:
    type: application
    platform: iOS
    sources:
      - MiGPS
      - Shared
    info:
      path: MiGPS/Info.plist
      properties:
        CFBundleDisplayName: Mi GPS
        UILaunchScreen:
          UIColorName: ""
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSLocationWhenInUseUsageDescription: Mi GPS usa tu ubicación para mostrarte en el mapa y guiarte.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dupratfrancisco.migps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MiGPSWidget
  MiGPSWidget:
    type: app-extension
    platform: iOS
    sources:
      - MiGPSWidget
      - Shared
    info:
      path: MiGPSWidget/Info.plist
      properties:
        CFBundleDisplayName: Mi GPS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dupratfrancisco.migps.widget
        SKIP_INSTALL: YES
