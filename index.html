<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi GPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="clave.js?v=2"></script>
<style>
.leaflet-container{background:#1b2029}
.leaflet-control-attribution{font-size:10px;background:#0e1116aa!important;color:#9aa3b2}
.leaflet-control-attribution a{color:#9aa3b2}
:root{--bg:#0e1116;--panel:#171b22;--line:#262c36;--ink:#f2f4f7;--mute:#9aa3b2;--blue:#0a5cff;--green:#00a05a;--amber:#ffb400;--red:#e6261f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
button,input{font:inherit;color:inherit}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--line);font-weight:700;cursor:pointer}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);color:#fff}
.fab{position:fixed;right:14px;width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);box-shadow:0 4px 14px #0006;display:grid;place-items:center;cursor:pointer;z-index:5}
#btnMe{top:calc(14px + env(safe-area-inset-top))}
#btnCfg{top:calc(72px + env(safe-area-inset-top))}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0007;max-height:62vh;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
form.search{display:flex;gap:8px}
form.search input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-weight:700;cursor:pointer}
.status{color:var(--mute);font-size:14px;margin:10px 2px 0}
.routes{display:grid;gap:8px;margin-top:10px}
.route{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);cursor:pointer}
.route.sel{border-color:var(--blue)}
.route .t{font-size:28px;font-weight:800;line-height:1.05}
.route .eta{font-weight:700;text-align:right;white-space:nowrap}
.route .sub{color:var(--mute);font-size:14px;grid-column:1/-1}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;color:#000}
.meArrow{width:44px;height:44px;display:grid;place-items:center}
.meArrow svg{width:40px;height:40px;transition:transform .4s ease;filter:drop-shadow(0 2px 4px #000a)}
.limit{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:6px solid var(--red);color:#111;display:grid;place-items:center;font-weight:800;font-size:19px}
.limit.none{display:none}
.speed{flex:none;text-align:center;min-width:52px}
.speed b{display:block;font-size:24px;line-height:1}
.speed small{color:var(--mute);font-size:12px}
.speed.over b{color:var(--red)}
.radar{position:fixed;left:10px;z-index:6;top:calc(130px + env(safe-area-inset-top));background:var(--red);color:#fff;font-weight:800;border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px #0008;display:none}
body.nav .radar.on{display:block}
.camIcon{width:26px;height:26px;border-radius:50%;background:var(--red);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 6px #0008}
.startNav{width:100%;margin-top:10px;min-height:54px;font-size:18px;font-weight:800}
body.nav .sheet,body.nav #btnCfg{display:none}
.navTop,.navBot{position:fixed;left:10px;right:10px;z-index:6;display:none}
body.nav .navTop,body.nav .navBot{display:flex}
.navTop{top:calc(10px + env(safe-area-inset-top));gap:14px;align-items:center;background:var(--green);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 6px 20px #0008;right:70px}
.navTop .arrow{flex:none;width:64px;height:64px;display:grid;place-items:center}
.navTop .arrow svg{width:56px;height:56px;transition:transform .3s}
.navTop .dist{font-size:34px;font-weight:800;line-height:1}
.navTop .msg{font-size:17px;font-weight:700;line-height:1.25;margin-top:4px}
.navTop .then{font-size:13px;opacity:.85;margin-top:6px}
.navBot{bottom:calc(10px + env(safe-area-inset-bottom));align-items:center;gap:12px;background:var(--panel);border-radius:18px;padding:12px 14px;box-shadow:0 -4px 20px #0008}
.navBot .big{font-size:26px;font-weight:800;color:var(--green);line-height:1}
.navBot .small{color:var(--mute);font-size:14px}
.navBot .grow{flex:1}
.navBot .btn{flex:none}
.navBot .exit{background:var(--red);color:#fff}
@media(max-width:600px){.navTop .dist{font-size:28px}.navTop .arrow{width:52px;height:52px}.navTop .arrow svg{width:46px;height:46px}}
dialog{border:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(520px,94vw);padding:18px;max-height:90vh}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 6px;font-size:22px}
dialog p{color:var(--mute);margin:4px 0 12px;font-size:14px}
dialog label{display:block;font-weight:700;margin:12px 0 6px}
dialog input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.favrow{display:grid;grid-template-columns:7em 1fr 44px;gap:6px;margin-bottom:6px}
.favrow button{border:0;border-radius:10px;background:var(--line);cursor:pointer;font-size:18px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<button class="fab" id="btnMe" aria-label="Centrar en mi ubicación">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
<button class="fab" id="btnCfg" aria-label="Ajustes">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>

<section class="sheet" id="sheet">
  <div class="grab"></div>
  <form class="search" id="searchForm">
    <input id="dest" type="search" placeholder="¿A dónde vas?" autocomplete="off" enterkeyhint="go">
    <button class="btn pri" type="submit">Ir</button>
  </form>
  <div class="chips" id="chips"></div>
  <div class="status" id="status">Buscando tu ubicación…</div>
  <div class="routes" id="routes"></div>
  <button class="btn pri startNav hidden" id="go" type="button">▶ Iniciar navegación</button>
</section>

<div class="navTop" id="navTop" aria-live="polite">
  <div class="arrow"><svg id="navArrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5 11l7-7 7 7"/></svg></div>
  <div>
    <div class="dist" id="navDist">—</div>
    <div class="msg" id="navMsg">Calculando…</div>
    <div class="then" id="navThen"></div>
  </div>
</div>
<div class="radar" id="navRadar">RADAR</div>
<div class="navBot" id="navBot">
  <div class="limit none" id="navLimit" aria-label="Límite de velocidad"></div>
  <div class="speed" id="navSpeedBox"><b id="navSpeed">0</b><small>km/h</small></div>
  <div class="grow">
    <div class="big" id="navEta">—</div>
    <div class="small" id="navRest">—</div>
  </div>
  <button class="btn" id="navVoice" type="button" aria-label="Silenciar voz">🔊</button>
  <button class="btn" id="navSim" type="button">Simular</button>
  <button class="btn exit" id="navExit" type="button">Salir</button>
</div>

<dialog id="cfg">
  <h2>Ajustes</h2>
  <p>Todo se guarda solo en este celular. La clave no se sube a GitHub.</p>
  <label for="key">Clave de TomTom</label>
  <input id="key" type="password" placeholder="Pegá tu clave de TomTom" autocomplete="off">
  <label>Destinos frecuentes</label>
  <div id="favList"></div>
  <button class="btn" id="addFav" type="button">+ Agregar destino</button>
  <div class="row">
    <button class="btn" id="cfgCancel" type="button">Cancelar</button>
    <button class="btn pri" id="cfgSave" type="button">Guardar</button>
  </div>
</dialog>

<script>
{
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('migps:'+k); return v ? JSON.parse(v) : d }catch{ return d } },
  set(k, v){ try{ localStorage.setItem('migps:'+k, JSON.stringify(v)) }catch{} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let apiKey = (window.TOMTOM_KEY || '').trim() || store.get('key', '');
let favs = store.get('favs', [
  {name:'Casa', addr:''},
  {name:'Facu', addr:'Universidad de Palermo, Mario Bravo 1050, CABA'},
  {name:'Laburo', addr:''}
]);
let map, meMarker, traffic, me = null, lines = [], routes = [], sel = 0, lastDest = '', refreshTimer;

const setStatus = t => $('#status').textContent = t;

/* ---------- Ajustes ---------- */
function favRow(f){
  const d = document.createElement('div');
  d.className = 'favrow';
  d.innerHTML = `<input placeholder="Nombre" value="${esc(f.name)}"><input placeholder="Dirección" value="${esc(f.addr)}"><button type="button" aria-label="Borrar">×</button>`;
  d.querySelector('button').onclick = () => d.remove();
  return d;
}
function openCfg(){
  $('#key').value = apiKey;
  const list = $('#favList'); list.innerHTML = '';
  favs.forEach(f => list.appendChild(favRow(f)));
  $('#cfg').showModal();
}
$('#addFav').onclick = () => $('#favList').appendChild(favRow({name:'', addr:''}));
$('#cfgCancel').onclick = () => $('#cfg').close();
$('#cfgSave').onclick = () => {
  const newKey = $('#key').value.trim();
  favs = [...document.querySelectorAll('.favrow')].map(r => {
    const [n, a] = r.querySelectorAll('input');
    return {name:n.value.trim(), addr:a.value.trim()};
  }).filter(f => f.name);
  store.set('favs', favs);
  renderChips();
  $('#cfg').close();
  if (newKey !== apiKey){ apiKey = newKey; store.set('key', apiKey); location.reload(); }
};
$('#btnCfg').onclick = openCfg;

function renderChips(){
  $('#chips').innerHTML = favs.map((f, i) => `<button class="chip" data-i="${i}">${esc(f.name)}</button>`).join('');
}
$('#chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const f = favs[+b.dataset.i];
  if (!f.addr){ openCfg(); return; }
  $('#dest').value = f.addr;
  route(f.addr);
};
$('#searchForm').onsubmit = e => { e.preventDefault(); const v = $('#dest').value.trim(); if (v) route(v); };

/* ---------- Mapa (TomTom + Leaflet) ---------- */
const T = 'https://api.tomtom.com';
const fmtMin = s => { const m = Math.round(s/60); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; };
const fmtKm = m => m < 1000 ? `${m} m` : `${(m/1000).toFixed(1).replace('.', ',')} km`;
const fmtHora = d => d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});

function initMap(){
  map = L.map('map', {zoomControl:false, attributionControl:true}).setView([-34.6037, -58.3816], 13);
  L.tileLayer(`${T}/map/1/tile/basic/night/{z}/{x}/{y}.png?key=${encodeURIComponent(apiKey)}&language=es-ES`, {
    maxZoom:20, attribution:'© TomTom'
  }).addTo(map);
  traffic = L.tileLayer(`${T}/traffic/map/4/tile/flow/relative0-dark/{z}/{x}/{y}.png?key=${encodeURIComponent(apiKey)}`, {
    maxZoom:20, opacity:.9
  }).addTo(map);
  startGps();
}

function startGps(){
  if (!navigator.geolocation){ setStatus('Este navegador no da ubicación.'); return; }
  let first = true;
  navigator.geolocation.watchPosition(p => {
    if (nav && nav.sim) return;
    me = {lat:p.coords.latitude, lng:p.coords.longitude};
    const h = p.coords.heading;
    mySpeed = p.coords.speed != null && !isNaN(p.coords.speed) ? p.coords.speed * 3.6 : mySpeed;
    if (h != null && !isNaN(h) && (p.coords.speed || 0) > 0.7) myHeading = h;
    else if (lastFix && hav([lastFix.lat, lastFix.lng], [me.lat, me.lng]) > 6) myHeading = bearing([lastFix.lat, lastFix.lng], [me.lat, me.lng]);
    if (!lastFix || hav([lastFix.lat, lastFix.lng], [me.lat, me.lng]) > 6) lastFix = me;
    if (!nav) setMe([me.lat, me.lng], myHeading);
    if (nav && !nav.sim) navUpdate(me, p.coords.heading);
    if (first){ map.setView([me.lat, me.lng], 15); first = false; if (!routes.length) setStatus('Listo. Elegí un destino.'); }
  }, () => setStatus('No pude obtener tu ubicación: activá el permiso de ubicación para esta página.'),
  {enableHighAccuracy:true, maximumAge:5000});
}
$('#btnMe').onclick = () => { if (me && map) map.setView([me.lat, me.lng], 16); };

/* ---------- Rutas con tráfico (TomTom Routing) ---------- */
async function geocode(q){
  const u = `${T}/search/2/search/${encodeURIComponent(q)}.json?key=${encodeURIComponent(apiKey)}&limit=1&countrySet=AR&language=es-419&lat=${me.lat}&lon=${me.lng}`;
  const r = await fetch(u); const d = await r.json();
  if (!r.ok) throw new Error(d.errorText || d.detailedError?.message || 'Error ' + r.status);
  const hit = d.results?.[0];
  if (!hit) throw new Error('no encontré esa dirección');
  return {lat:hit.position.lat, lng:hit.position.lon};
}

async function fetchRoutes(from, to, alts){
  const u = `${T}/routing/1/calculateRoute/${from.lat},${from.lng}:${to.lat},${to.lng}/json?key=${encodeURIComponent(apiKey)}&traffic=true&travelMode=car&routeType=fastest&maxAlternatives=${alts}&computeTravelTimeFor=all&instructionsType=text&sectionType=speedLimit&language=es-ES`;
  const r = await fetch(u); const data = await r.json();
  if (!r.ok) throw new Error(data.error?.description || data.detailedError?.message || 'Error ' + r.status);
  if (!data.routes?.length) throw new Error('no encontré ruta a ese destino');
  return data.routes.map(x => {
    const path = x.legs.flatMap(l => l.points.map(p => [p.latitude, p.longitude]));
    const cum = [0];
    for (let i = 1; i < path.length; i++) cum.push(cum[i-1] + hav(path[i-1], path[i]));
    return {
      dur:x.summary.travelTimeInSeconds,
      delay:x.summary.trafficDelayInSeconds || 0,
      dist:x.summary.lengthInMeters,
      path, cum,
      limits:(x.sections || []).filter(z => z.sectionType === 'SPEED_LIMIT' && z.maxSpeedLimitInKmh).map(z => ({s:z.startPointIndex, e:z.endPointIndex, v:z.maxSpeedLimitInKmh})),
      cams:[],
      instr:(x.guidance?.instructions || []).map(g => ({
        off:g.routeOffsetInMeters, msg:g.message || '', man:g.maneuver || '', pt:[g.point.latitude, g.point.longitude]
      }))
    };
  }).sort((a, b) => a.dur - b.dur);
}

async function route(dest){
  if (!me){ setStatus('Todavía no tengo tu ubicación.'); return; }
  lastDest = dest;
  setStatus('Calculando con el tráfico de ahora…');
  try{
    destPos = await geocode(dest);
    routes = await fetchRoutes(me, destPos, 2);
    sel = 0;
    draw();
    setStatus(`Actualizado ${fmtHora(new Date())} · se recalcula cada 2 min`);
    clearInterval(refreshTimer);
    refreshTimer = setInterval(() => { if (lastDest && !nav) route(lastDest); }, 120000);
  }catch(e){
    setStatus('No pude calcular la ruta: ' + e.message);
  }
}

function clearRoutes(){ lines.forEach(l => l.remove()); lines = []; routes = []; $('#routes').innerHTML = ''; $('#go').classList.add('hidden'); }

function draw(){
  lines.forEach(l => l.remove());
  const order = routes.map((_, i) => i).sort((a, b) => (a === sel) - (b === sel));
  lines = [];
  order.forEach(i => {
    const l = L.polyline(routes[i].path, {
      color:i === sel ? '#0a5cff' : '#6b7486', opacity:i === sel ? .95 : .7, weight:i === sel ? 8 : 6
    }).addTo(map);
    l.on('click', () => { sel = i; draw(); });
    lines.push(l);
  });
  if (nav) return;
  map.fitBounds(L.latLngBounds(routes[sel].path), {paddingTopLeft:[30, 100], paddingBottomRight:[70, Math.round(innerHeight * .45)]});

  $('#routes').innerHTML = routes.map((r, i) => {
    const mins = Math.round(r.delay / 60);
    const tag = mins >= 10 ? `<span class="tag" style="background:var(--red);color:#fff">+${mins} min tráfico</span>`
              : mins >= 3 ? `<span class="tag" style="background:var(--amber)">+${mins} min tráfico</span>`
              : `<span class="tag" style="background:var(--green);color:#fff">fluido</span>`;
    return `<button class="route ${i === sel ? 'sel' : ''}" data-i="${i}">
      <span class="t">${fmtMin(r.dur)}${tag}</span>
      <span class="eta">Llegás ${fmtHora(new Date(Date.now() + r.dur * 1000))}</span>
      <span class="sub">${fmtKm(r.dist)}${i === 0 ? ' · la más rápida' : ''}</span>
    </button>`;
  }).join('');

  $('#go').classList.remove('hidden');
}
$('#routes').onclick = e => { const b = e.target.closest('.route'); if (b){ sel = +b.dataset.i; draw(); } };

/* ---------- Navegación paso a paso ---------- */
let nav = null, voiceOn = true, wakeLock = null;

function hav(a, b){
  const R = 6371000, k = Math.PI / 180;
  const dLat = (b[0] - a[0]) * k, dLng = (b[1] - a[1]) * k;
  const s = Math.sin(dLat/2) ** 2 + Math.cos(a[0]*k) * Math.cos(b[0]*k) * Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
let myHeading = 0, lastFix = null, rotDeg = 0, mySpeed = 0, camLayer = null;

/* Radares: cámaras de velocidad de OpenStreetMap (Overpass) */
async function loadCams(r){
  if (!camLayer) camLayer = L.layerGroup().addTo(map);
  camLayer.clearLayers();
  r.cams = [];
  const lats = r.path.map(p => p[0]), lngs = r.path.map(p => p[1]);
  const pad = .005, bb = [Math.min(...lats)-pad, Math.min(...lngs)-pad, Math.max(...lats)+pad, Math.max(...lngs)+pad].join(',');
  const q = `[out:json][timeout:20];(node["highway"="speed_camera"](${bb});node["enforcement"="maxspeed"](${bb}););out;`;
  try{
    const res = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}});
    const d = await res.json();
    const cams = [];
    for (const n of d.elements || []){
      const loc = locate(r, [n.lat, n.lon], 0, true);
      if (loc.off > 35) continue;
      const max = parseInt(n.tags?.maxspeed) || null;
      cams.push({along:loc.along, max, pt:[n.lat, n.lon]});
    }
    cams.sort((a, b) => a.along - b.along);
    r.cams = cams;
    cams.forEach(c => L.marker(c.pt, {interactive:false, icon:L.divIcon({className:'', iconSize:[26, 26], iconAnchor:[13, 13],
      html:'<div class="camIcon"><svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="13" r="3.5" fill="#e6261f"/></svg></div>'})}).addTo(camLayer));
  }catch{}
}
function bearing(a, b){
  const k = Math.PI / 180, y = Math.sin((b[1]-a[1])*k) * Math.cos(b[0]*k);
  const x = Math.cos(a[0]*k) * Math.sin(b[0]*k) - Math.sin(a[0]*k) * Math.cos(b[0]*k) * Math.cos((b[1]-a[1])*k);
  return (Math.atan2(y, x) / k + 360) % 360;
}
function setMe(ll, deg){
  if (!meMarker){
    meMarker = L.marker(ll, {zIndexOffset:1000, interactive:false, icon:L.divIcon({className:'', iconSize:[44, 44], iconAnchor:[22, 22],
      html:'<div class="meArrow"><svg viewBox="0 0 40 40"><path d="M20 3 L34 35 L20 27 L6 35 Z" fill="#0a5cff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>'})}).addTo(map);
  } else meMarker.setLatLng(ll);
  let d = ((deg - rotDeg) % 360 + 540) % 360 - 180;
  rotDeg += d;
  const svg = meMarker.getElement()?.querySelector('svg');
  if (svg) svg.style.transform = `rotate(${rotDeg}deg)`;
}
const ANG = {TURN_LEFT:-90, TURN_RIGHT:90, SHARP_LEFT:-135, SHARP_RIGHT:135, BEAR_LEFT:-45, BEAR_RIGHT:45,
  KEEP_LEFT:-30, KEEP_RIGHT:30, MAKE_UTURN:-180, TRY_MAKING_UTURN:-180, ENTER_MOTORWAY:30, ENTER_FREEWAY:30,
  ENTER_HIGHWAY:30, TAKE_EXIT:30, MOTORWAY_EXIT_LEFT:-30, MOTORWAY_EXIT_RIGHT:30, ROUNDABOUT_LEFT:-90,
  ROUNDABOUT_RIGHT:90, ROUNDABOUT_BACK:-180, SWITCH_PARALLEL_ROAD:30, SWITCH_MAIN_ROAD:-30};
const fmtDist = d => d >= 1000 ? `${(d/1000).toFixed(1).replace('.', ',')} km` : `${Math.max(0, Math.round(d/10)*10)} m`;
const sayDist = d => d >= 1000 ? `${(d/1000).toFixed(1).replace('.', ',')} kilómetros` : `${Math.round(d/50)*50} metros`;

function say(t){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'es-AR';
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch{}
}

function locate(r, p, from, all){
  const k = Math.PI / 180, kx = 111320 * Math.cos(p[0]*k), ky = 110540;
  const a0 = all ? 0 : Math.max(0, from - 10), a1 = all ? r.path.length - 2 : Math.min(r.path.length - 2, from + 200);
  let best = {d:Infinity, i:a0, t:0};
  for (let i = a0; i <= a1; i++){
    const A = r.path[i], B = r.path[i+1];
    const ax = (A[1]-p[1])*kx, ay = (A[0]-p[0])*ky, dx = (B[1]-A[1])*kx, dy = (B[0]-A[0])*ky;
    const L2 = dx*dx + dy*dy;
    const t = L2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy) / L2)) : 0;
    const d = Math.hypot(ax + t*dx, ay + t*dy);
    if (d < best.d) best = {d, i, t};
  }
  if (best.d === Infinity) return {i:0, along:0, off:0};
  return {i:best.i, along:r.cum[best.i] + best.t * (r.cum[best.i+1] - r.cum[best.i]), off:best.d};
}

function posAt(r, s){
  let i = 0;
  while (i < r.cum.length - 2 && r.cum[i+1] < s) i++;
  const seg = r.cum[i+1] - r.cum[i] || 1, t = Math.min(1, Math.max(0, (s - r.cum[i]) / seg));
  const A = r.path[i], B = r.path[i+1] || A;
  return {lat:A[0] + (B[0]-A[0])*t, lng:A[1] + (B[1]-A[1])*t};
}

function navUpdate(p){
  if (!nav) return;
  const r = nav.r, pt = [p.lat, p.lng];
  const loc = locate(r, pt, nav.idx);
  if (loc.off > 50){ if (++nav.offCount >= 3 && !nav.rerouting && !nav.sim) reroute(p); }
  else nav.offCount = 0;
  nav.idx = loc.i;

  const total = r.cum[r.cum.length - 1] || 1, scale = r.dist / total;
  const done = loc.along * scale, rest = Math.max(0, r.dist - done);

  if (rest < 25 && !nav.arrived){
    nav.arrived = true;
    $('#navDist').textContent = '';
    $('#navMsg').textContent = 'Llegaste a destino';
    $('#navThen').textContent = '';
    say('Llegaste a destino');
    setTimeout(stopNav, 4000);
    return;
  }

  let k = r.instr.findIndex(g => g.off > done + 5);
  if (k < 0) k = r.instr.length - 1;
  const g = r.instr[k] || {off:r.dist, msg:'Seguí por la ruta', man:''};
  const dNext = Math.max(0, g.off - done);
  $('#navDist').textContent = fmtDist(dNext);
  $('#navMsg').textContent = g.msg;
  const n = r.instr[k+1];
  $('#navThen').textContent = n && n.off - g.off < 250 ? 'Después: ' + n.msg : '';
  $('#navArrow').style.transform = `rotate(${ANG[g.man] || 0}deg)`;

  // límite de velocidad y velocidad actual
  const lim = r.limits.find(z => loc.i >= z.s && loc.i < z.e);
  const limEl = $('#navLimit');
  if (lim){ limEl.textContent = lim.v; limEl.classList.remove('none'); } else limEl.classList.add('none');
  const spd = Math.round(nav.sim ? 72 : mySpeed);
  $('#navSpeed').textContent = spd;
  const over = lim && spd > lim.v + 3;
  $('#navSpeedBox').classList.toggle('over', !!over);
  if (over && Date.now() - (nav.overSaid || 0) > 30000){ say(`Cuidado, el límite es ${lim.v}`); nav.overSaid = Date.now(); }

  // radares
  const cam = r.cams.find(c => c.along > loc.along - 10);
  const radarEl = $('#navRadar');
  if (cam){
    const dc = (cam.along - loc.along) * scale;
    if (dc < 600){
      radarEl.textContent = `RADAR a ${fmtDist(dc)}${cam.max ? ' · ' + cam.max + ' km/h' : ''}`;
      radarEl.classList.add('on');
      if (!cam.said && dc > 60){ cam.said = true; say(`Radar a ${sayDist(dc)}${cam.max ? ', máxima ' + cam.max : ''}`); }
    } else radarEl.classList.remove('on');
  } else radarEl.classList.remove('on');

  const secs = r.dur * rest / r.dist;
  $('#navEta').textContent = 'Llegás ' + fmtHora(new Date(Date.now() + secs * 1000));
  $('#navRest').textContent = `${fmtMin(secs)} · ${fmtKm(Math.round(rest))}`;

  const st = nav.spoken[k] || 0;
  if (dNext <= 450 && dNext > 120 && st < 1){ say(`En ${sayDist(dNext)}, ${g.msg}`); nav.spoken[k] = 1; }
  else if (dNext <= 45 && st < 2){ say(g.msg); nav.spoken[k] = 2; }

  const A = r.path[loc.i], B = r.path[loc.i + 1] || A;
  setMe(pt, A === B ? myHeading : bearing(A, B));
  map.setView(pt, 17, {animate:true});
}

function setNavRoute(r){
  nav.r = r; nav.idx = 0; nav.spoken = {}; nav.offCount = 0;
  loadCams(r);
  routes = [r]; sel = 0; draw();
}

async function reroute(p){
  nav.rerouting = true;
  $('#navMsg').textContent = 'Recalculando…';
  say('Recalculando');
  try{ const rs = await fetchRoutes(p, destPos, 0); if (nav) setNavRoute(rs[0]); }catch{}
  if (nav){ nav.rerouting = false; nav.offCount = 0; }
}

async function startNav(){
  if (!routes[sel] || !me) return;
  nav = {r:routes[sel], idx:0, spoken:{}, offCount:0, sim:null, rerouting:false, arrived:false};
  routes = [nav.r]; sel = 0;
  loadCams(nav.r);
  document.body.classList.add('nav');
  draw();
  const first = nav.r.instr.find(g => g.off > 5);
  say('Iniciando navegación.' + (first ? ' ' + first.msg : ''));
  navUpdate(me);
  nav.timer = setInterval(async () => {
    if (!nav || nav.sim || nav.rerouting || !me) return;
    try{ const rs = await fetchRoutes(me, destPos, 0); if (nav && !nav.sim){ const sp = nav.spoken; setNavRoute(rs[0]); nav.spoken = sp; navUpdate(me); } }catch{}
  }, 180000);
  try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{}
}

function stopNav(){
  if (!nav) return;
  clearInterval(nav.timer); clearInterval(nav.sim);
  camLayer.clearLayers(); $('#navRadar').classList.remove('on');
  nav = null;
  document.body.classList.remove('nav');
  $('#navSim').textContent = 'Simular';
  try{ speechSynthesis.cancel(); }catch{}
  try{ wakeLock && wakeLock.release(); }catch{}
  wakeLock = null;
  clearRoutes();
  setStatus('Navegación terminada. Elegí otro destino.');
  if (me){ setMe([me.lat, me.lng], myHeading); map.setView([me.lat, me.lng], 15); }
}

function toggleSim(){
  if (!nav) return;
  if (nav.sim){ clearInterval(nav.sim); nav.sim = null; $('#navSim').textContent = 'Simular'; return; }
  let s = nav.r.cum[nav.idx] || 0;
  $('#navSim').textContent = 'Parar';
  nav.sim = setInterval(() => {
    if (!nav) return;
    s += 12;
    const total = nav.r.cum[nav.r.cum.length - 1];
    navUpdate(posAt(nav.r, Math.min(s, total)));
  }, 600);
}

$('#go').onclick = startNav;
$('#navExit').onclick = stopNav;
$('#navSim').onclick = toggleSim;
$('#navVoice').onclick = () => {
  voiceOn = !voiceOn;
  $('#navVoice').textContent = voiceOn ? '🔊' : '🔇';
  if (!voiceOn) try{ speechSynthesis.cancel(); }catch{}
};
document.addEventListener('visibilitychange', async () => {
  if (nav && document.visibilityState === 'visible'){ try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{} }
});

/* ---------- Arranque ---------- */
let destPos = null;
renderChips();
if (!apiKey){
  setStatus('Primero cargá tu clave de TomTom en Ajustes (⚙).');
  openCfg();
} else if (typeof L === 'undefined'){
  setStatus('No cargó el mapa. Revisá tu conexión.');
} else {
  initMap();
}
}
</script>
