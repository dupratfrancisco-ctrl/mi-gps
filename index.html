<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi GPS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mi GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="clave.js?v=2"></script>
<style>
.maplibregl-map{background:#f1f0ec}
.maplibregl-ctrl-attrib{font-size:10px;background:#ffffffcc!important;color:#555}
.maplibregl-ctrl-attrib a{color:#555}
#btnNorth{top:calc(130px + env(safe-area-inset-top));display:none}
#navVoice{top:calc(72px + env(safe-area-inset-top));display:none;font-size:20px}
#btnPark{top:calc(188px + env(safe-area-inset-top));font-weight:800;font-size:20px;color:#fff;background:#1f6feb}
body.nav #btnPark{display:none}
.destPin{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid #111;display:grid;place-items:center;box-shadow:0 0 0 4px #0a5cff,0 4px 12px #000a}
.parkPin{width:34px;height:34px;border-radius:9px;background:#1f6feb;color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 3px 10px #0009}
.park{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.park .pi{width:34px;height:34px;flex:none;border-radius:9px;background:#1f6feb;color:#fff;display:grid;place-items:center;font-weight:800}
.park .tx{flex:1 1 140px;min-width:0}
.park .tx b{display:block}
.park .tx span{color:var(--mute);font-size:13px}
.park .btn{min-height:40px;padding:0 12px;font-size:14px}
body.nav #navVoice{display:grid}
#btnNorth.on{display:grid}
#btnNorth svg{transition:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mute);font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px}
:root.dark{--bg:#0e1116;--panel:#171b22;--line:#262c36;--ink:#f2f4f7;--mute:#9aa3b2}
:root.dark .maplibregl-map{background:#1b2029}
:root.dark .maplibregl-ctrl-attrib{background:#0e1116aa!important;color:#9aa3b2}
:root.dark .maplibregl-ctrl-attrib a{color:#9aa3b2}
:root.dark .when input{color-scheme:dark}
:root{--bg:#f3f4f6;--panel:#ffffff;--line:#e3e6eb;--ink:#15171c;--mute:#6b7280;--blue:#0a5cff;--green:#00a05a;--amber:#ffb400;--red:#e6261f}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0}
button,input{font:inherit;color:inherit}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--line);font-weight:700;cursor:pointer}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);color:#fff}
.fab{position:fixed;right:14px;width:48px;height:48px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);box-shadow:0 3px 12px #0003;display:grid;place-items:center;cursor:pointer;z-index:5}
#btnMe{top:calc(14px + env(safe-area-inset-top))}
#btnCfg{top:calc(72px + env(safe-area-inset-top))}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0002;max-height:62vh;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.fakeSearch{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--mute);padding:0 14px;font-size:16px;cursor:pointer;text-align:left}
.fakeSearch span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fakeSearch.has{color:var(--ink);font-weight:700}
.searchRow{display:flex;gap:8px;align-items:stretch}
.searchRow .fakeSearch{flex:1;min-width:0}
.cancelDest{display:none;flex:none;width:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);place-items:center;cursor:pointer}
.fakeSearch.has + .cancelDest{display:grid}
.searchView{position:fixed;inset:0;z-index:30;background:var(--panel);display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));overflow:auto}
.searchView.on{display:flex}
.searchView .sugg{border:0;background:none;margin-top:6px}
.searchView .sugg button{border-bottom:1px solid var(--line)}
.sv-back{flex:none;width:44px;height:48px;border:0;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.sv-clear{flex:none;min-height:48px;border:0;border-radius:12px;padding:0 14px;background:var(--line);color:var(--ink);font-weight:700;cursor:pointer}
form.search{display:flex;gap:8px;align-items:center}
form.search input{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.sugg{display:grid;margin-top:8px;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.sugg:empty{display:none}
.favSugg{max-height:40vh;overflow-y:auto}
.favPicked{color:var(--green);font-size:13px;font-weight:700;margin-top:6px}
.favPicked:empty{display:none}
.sugg button{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;min-height:56px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.histHd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;color:var(--mute);font-size:13px;font-weight:700}
.sugg .histClr{display:inline;min-height:0;border:0;padding:4px 0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--line)}
.sugg .ic{grid-row:1/3;width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.sugg .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .ad{grid-column:2;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg .km{grid-row:1/3;grid-column:3;color:var(--mute);font-size:13px;white-space:nowrap}
.when{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.when select,.when input{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:16px}
.when select{flex:1 1 150px}
.when input{flex:1 1 190px;color-scheme:light}
.route .plan{grid-column:1/-1;color:var(--amber);font-weight:700;font-size:14px}
.modes{display:flex;gap:6px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.modes button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--mute)}
.modes button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px #0002}
.modes svg{width:20px;height:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-weight:700;cursor:pointer}
.chip{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;color:var(--ink)}
.delChip{background:#e6261f1a!important;border-color:#e6261f!important;color:#e6261f!important}
.delChip b{margin-left:4px}
.doneChip{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
.addChip{border-style:dashed;color:var(--blue)!important;background:none}
#favDlg .row .btn{flex:1}
#favUseLast{width:100%;margin-top:8px}
.status{color:var(--mute);font-size:14px;margin:10px 2px 0}
.routes{display:grid;gap:8px;margin-top:10px}
.route{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);cursor:pointer}
.route.sel{border-color:var(--blue)}
.route .t{font-size:28px;font-weight:800;line-height:1.05}
.route .eta{font-weight:700;text-align:right;white-space:nowrap}
.route .sub{color:var(--mute);font-size:14px;grid-column:1/-1}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;color:#000}
.meArrow{width:70px;height:70px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#2fb9d633 0 55%,#2fb9d600 70%)}
.meArrow svg{width:44px;height:44px;filter:drop-shadow(0 3px 3px #0005)}
.limit{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:6px solid var(--red);color:#111;display:grid;place-items:center;font-weight:800;font-size:19px}
.limit.none{display:none}
.speed{flex:none;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #4a4e57;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111;box-shadow:0 1px 4px #0003}
.speed b{display:block;font-size:16px;line-height:1;font-weight:800}
.speed small{font-size:7.5px;line-height:1;color:#555;margin-top:1px}
.speed.over{background:var(--red);border-color:var(--red);color:#fff}
.speed.over small{color:#fff}
.flowPill{position:fixed;right:10px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;display:none;align-items:center;gap:8px;background:var(--panel);color:var(--ink);border-radius:14px;padding:9px 13px;font-weight:700;font-size:14px;box-shadow:0 4px 14px #0004;max-width:62vw}
body.nav .flowPill.on{display:flex}
.flowPill i{flex:none;width:12px;height:12px;border-radius:50%}
.flowPill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recenter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:7;display:none;min-height:48px;padding:0 22px;border:0;border-radius:24px;background:#0a5cff;color:#fff;font:inherit;font-weight:800;font-size:17px;box-shadow:0 6px 18px #000a;cursor:pointer}
body.nav .recenter.on{display:block}
.radar{position:fixed;left:10px;z-index:6;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--red);color:#fff;font-weight:800;border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px #0008;display:none}
body.nav .radar.on{display:block}
.camIcon{width:26px;height:26px;border-radius:50%;background:var(--red);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 6px #0008}
.startNav{width:100%;margin-top:10px;min-height:54px;font-size:18px;font-weight:800}
body.nav .sheet,body.nav #btnCfg,body.nav .drive{display:none}
.drive{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:40px;padding:6px 16px 6px 6px;box-shadow:0 4px 14px #0008}
.drive .limit{width:56px;height:56px;font-size:21px}
.drive .speed{width:44px;height:44px}
.drive .speed b{font-size:17px}
.navTop,.navBot{position:fixed;left:10px;right:10px;z-index:6;display:none}
body.nav .navTop,body.nav .navBot{display:flex}
.navTop{top:0;left:0!important;right:0!important;gap:16px;align-items:center;background:#0b0b0c;color:#fff;border-radius:0 0 20px 20px;padding:calc(14px + env(safe-area-inset-top)) 18px 16px;box-shadow:0 6px 20px #0005}
.navTop .arrow{flex:none;width:64px;height:64px;display:grid;place-items:center}
.navTop .arrow svg{width:60px;height:60px}
.navTop .dist{font-size:36px;font-weight:800;line-height:1}
.navTop .msg{font-size:28px;font-weight:800;line-height:1.1;margin-top:4px;color:#2fd2ff}
.navTop .sub{font-size:14px;color:#c9ccd3;margin-top:4px}
.navTop .then{font-size:13px;color:#9aa0aa;margin-top:4px}
.navBot{left:0!important;right:0!important;bottom:0;align-items:center;gap:10px;background:var(--panel);border-radius:20px 20px 0 0;padding:12px 12px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0008}
.navBot .big{font-size:26px;font-weight:800;color:var(--green);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navBot .small{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navBot .grow{flex:1;min-width:0}
.navBot .btn{flex:none;padding:0 12px}
@media(max-width:430px){.navBot .lbl{display:none}.navBot{gap:7px;padding-left:10px;padding-right:10px}.navBot .big{font-size:21px}.navBot .small{font-size:12.5px}.navBot .limit{width:44px;height:44px;font-size:17px;border-width:5px}.navBot .speed{width:38px;height:38px}.navBot .speed b{font-size:14px}.navBot .btn{padding:0 9px;font-size:14px;min-height:42px}}
.navBot .exit{background:var(--red);color:#fff}
@media(max-width:600px){.navTop .dist{font-size:30px}.navTop .msg{font-size:23px}.navTop .arrow{width:56px;height:56px}.navTop .arrow svg{width:52px;height:52px}}
body.nav #btnMe{top:calc(150px + env(safe-area-inset-top))}
body.nav #navVoice{top:calc(208px + env(safe-area-inset-top))}
body.nav #btnNorth{top:calc(266px + env(safe-area-inset-top))}
.camMk{display:flex;align-items:center;gap:3px;padding:3px 7px 3px 4px;border-radius:16px;background:#7c3aed;border:2px solid #fff;color:#fff;font:800 12px system-ui;box-shadow:0 2px 8px #0006}
.camMk svg{display:block}
.jam{width:30px;height:30px;border-radius:50%;background:#e6261f;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 8px #0006}
dialog{border:0;border-radius:18px;background:var(--panel);color:var(--ink);width:min(520px,94vw);padding:18px;max-height:90vh}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 6px;font-size:22px}
dialog p{color:var(--mute);margin:4px 0 12px;font-size:14px}
dialog label{display:block;font-weight:700;margin:12px 0 6px}
dialog input{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
.favrow{display:grid;grid-template-columns:7em 1fr 44px;gap:6px;margin-bottom:6px}
.favrow button{border:0;border-radius:10px;background:var(--line);cursor:pointer;font-size:18px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="map"></div>

<div class="drive" id="drive">
  <div class="limit none" id="driveLimit" aria-label="Límite de velocidad"></div>
  <div class="speed" id="driveSpeedBox"><b id="driveSpeed">0</b><small>km/h</small></div>
</div>
<button class="fab" id="btnMe" aria-label="Centrar en mi ubicación">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
<button class="fab" id="navVoice" type="button" aria-label="Silenciar voz">🔊</button>
<button class="fab" id="btnPark" type="button" aria-label="Guardar dónde estacioné">P</button>
<button class="fab" id="btnNorth" aria-label="Volver al norte"><svg id="northIc" width="26" height="26" viewBox="0 0 24 24"><path d="M12 2 L16 12 L12 10 L8 12 Z" fill="#e6261f"/><path d="M12 22 L8 12 L12 14 L16 12 Z" fill="#9aa3b2"/></svg></button>
<button class="fab" id="btnCfg" aria-label="Ajustes">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>

<section class="searchView" id="searchView" aria-label="Buscar destino">
  <form class="search" id="searchForm">
    <button class="sv-back" id="searchClose" type="button" aria-label="Volver">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <input id="dest" type="text" inputmode="search" placeholder="Escribí una dirección o un lugar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="sv-clear" id="searchClear" type="button">Borrar</button>
  </form>
  <div class="modes" id="modes2" role="tablist" aria-label="Cómo vas">
    <button type="button" data-m="car" role="tab"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11v6.5a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V17H8v.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V11zm2.2-.5h9.6l-1-2.8H8.2l-1 2.8zM7.5 15a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4zm9 0a1.2 1.2 0 1 0 0-2.4 1.2 1.2 0 0 0 0 2.4z"/></svg>Auto</button>
    <button type="button" data-m="pedestrian" role="tab"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="13" cy="4" r="2"/><path d="M10.5 8.5l2.6-.9a2 2 0 0 1 2.3.9l1.4 2.4 2.2 1.1-.7 1.4-2.7-1.3-.9-1.5-.8 3.4 2.1 2.3V21h-1.6v-4.1l-2.2-2.2-.9 3.4L9 21.5l-1.4-.8 2.1-3.3 1.6-6.4-1.6.6-1.1 2.6-1.5-.6 1.4-3.4z"/></svg>A pie</button>
    <button type="button" data-m="bicycle" role="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l3 7M13 6h3"/></svg>Bici</button>
  </div>
  <div class="chips" id="chips2"></div>
  <div class="sugg" id="sugg" role="listbox"></div>
</section>

<section class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="searchRow">
  <button class="fakeSearch" id="openSearch" type="button">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <span id="openSearchTx">¿A dónde vas?</span>
  </button>
  <button class="cancelDest" id="cancelDest" type="button" aria-label="Cancelar búsqueda"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="when">
    <select id="whenMode" aria-label="Cuándo salís">
      <option value="now">Salir ahora</option>
      <option value="depart">Salir a las…</option>
      <option value="arrive">Llegar a las…</option>
    </select>

<script>
{
const $ = s => document.querySelector(s);
// Guarda la configuración en el navegador y, en la app de iPhone, también en el teléfono (no se borra al cerrar)
const store = {
  get(k, d){
    try{
      let v = localStorage.getItem('migps:'+k);
      if (v == null && window.__nativeStore && window.__nativeStore[k] != null){ v = window.__nativeStore[k]; localStorage.setItem('migps:'+k, v); }
      return v ? JSON.parse(v) : d;
    }catch{ return d }
  },
  set(k, v){
    const j = JSON.stringify(v);
    try{ localStorage.setItem('migps:'+k, j) }catch{}
    try{ window.webkit?.messageHandlers?.migps?.postMessage({type:'store', key:k, value:j}); }catch{}
  }
};
try{ navigator.storage?.persist?.(); }catch{}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let apiKey = (window.TOMTOM_KEY || '').trim() || store.get('key', '');
let favs = store.get('favs', [
  {name:'Casa', addr:''},
  {name:'Facu', addr:'Universidad de Palermo, Mario Bravo 1050, CABA'},
  {name:'Laburo', addr:''}
]);
let map, meMarker, me = null, routes = [], sel = 0, lastDest = '', lastDestPos = null, refreshTimer;

const setStatus = t => $('#status').textContent = t;

/* ---------- Ajustes ---------- */
function favRow(f){
  const d = document.createElement('div');
  d.className = 'favrow';
  d.innerHTML = `<input placeholder="Nombre" value="${esc(f.name)}"><input placeholder="Dirección" value="${esc(f.addr)}"><button type="button" aria-label="Borrar">×</button>`;
  d.querySelector('button').onclick = () => d.remove();
  return d;
}
function openCfg(){
  $('#key').value = apiKey;
  const list = $('#favList'); list.innerHTML = '';
  favs.forEach(f => list.appendChild(favRow(f)));
  $('#cfg').showModal();
}
$('#addFav').onclick = () => $('#favList').appendChild(favRow({name:'', addr:''}));
$('#cfgCancel').onclick = () => $('#cfg').close();
$('#cfgSave').onclick = () => {
  const newKey = $('#key').value.trim();
  favs = [...document.querySelectorAll('.favrow')].map(r => {
    const [n, a] = r.querySelectorAll('input');
    return {name:n.value.trim(), addr:a.value.trim()};
  }).filter(f => f.name);
  store.set('favs', favs);
  renderChips();
  $('#cfg').close();
  if (newKey !== apiKey){ apiKey = newKey; store.set('key', apiKey); location.reload(); }
};
$('#btnCfg').onclick = openCfg;

let chipEdit = false;
function renderChips(){
  const html = chipEdit
    ? favs.map((f, i) => `<button class="chip delChip" data-del="${i}" aria-label="Eliminar ${esc(f.name)}">${esc(f.name)} <b>✕</b></button>`).join('')
      + `<button class="chip doneChip" data-done="1">Listo</button>`
    : favs.map((f, i) => `<button class="chip" data-i="${i}">${esc(f.name)}</button>`).join('')
      + `<button class="chip addChip" data-add="1" aria-label="Nuevo atajo">＋ Nuevo</button>`
      + (favs.length ? `<button class="chip addChip" data-edit="1">Eliminar</button>` : '');
  $('#chips').innerHTML = html; $('#chips2').innerHTML = html;
}
const chipClick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.add){ openFav(-1); return; }
  if (b.dataset.edit){ chipEdit = true; renderChips(); return; }
  if (b.dataset.done){ chipEdit = false; renderChips(); return; }
  if (b.dataset.del != null){ favs.splice(+b.dataset.del, 1); store.set('favs', favs); if (!favs.length) chipEdit = false; renderChips(); return; }
  const f = favs[+b.dataset.i];
  if (!f.addr){ openFav(+b.dataset.i); return; }
  $('#dest').value = f.addr;
  addHist({name:f.addr, cat:f.name, pos:f.pos});
  closeSearch();
  route(f.addr, f.pos || undefined);
};
$('#chips').onclick = chipClick; $('#chips2').onclick = chipClick;
/* Crear o editar un atajo (mantené apretado un atajo para editarlo) */
let favEdit = -1;
function openFav(i){
  favEdit = i;
  const f = i >= 0 ? favs[i] : {name:'', addr:''};
  $('#favDlgT').textContent = i >= 0 ? `Editar ${f.name}` : 'Nuevo atajo';
  $('#favN').value = f.name; $('#favA').value = f.addr;
  favPos = f.pos || null; favSuggs = []; $('#favSugg').innerHTML = '';
  $('#favPicked').textContent = favPos ? '✓ Lugar elegido' : '';
  $('#favDel').style.display = i >= 0 ? '' : 'none';
  $('#favUseLast').style.display = lastDest ? '' : 'none';
  $('#favDlg').showModal();
  setTimeout(() => (f.name ? $('#favA') : $('#favN')).focus(), 50);
}
let favPos = null, favSuggs = [], favSeq = 0, favTimer;
$('#favUseLast').onclick = () => { $('#favA').value = lastDest; favPos = lastDestPos; favSeq++; $('#favSugg').innerHTML = ''; $('#favPicked').textContent = favPos ? '✓ Lugar elegido' : ''; };
$('#favA').addEventListener('input', () => {
  favPos = null; $('#favPicked').textContent = '';
  clearTimeout(favTimer);
  const q = $('#favA').value.trim();
  if (q.length < 3 || !apiKey){ favSeq++; $('#favSugg').innerHTML = ''; return; }
  favTimer = setTimeout(() => loadSugg(q, true), 280);
});
$('#favSugg').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const s = favSuggs[+b.dataset.i]; if (!s) return;
  $('#favA').value = s.isPoi ? `${s.name}, ${s.addr}` : `${s.name}${s.addr ? ', ' + s.addr : ''}`;
  favPos = s.pos; favSeq++; $('#favSugg').innerHTML = '';
  $('#favPicked').textContent = '✓ Lugar elegido';
};
$('#favCancel').onclick = () => $('#favDlg').close();
$('#favDel').onclick = () => { if (favEdit >= 0){ favs.splice(favEdit, 1); store.set('favs', favs); renderChips(); } $('#favDlg').close(); };
$('#favOk').onclick = () => {
  const n = $('#favN').value.trim(), a = $('#favA').value.trim();
  if (!n){ $('#favN').focus(); return; }
  const f = {name:n, addr:a}; if (a && favPos) f.pos = favPos;
  if (favEdit >= 0) favs[favEdit] = f; else favs.push(f);
  store.set('favs', favs); renderChips(); $('#favDlg').close();
};
// mantener apretado (o clic derecho) un atajo para editarlo
for (const id of ['#chips', '#chips2']){
  let t = null, longDone = false;
  const el = $(id);
  el.addEventListener('pointerdown', e => {
    const b = e.target.closest('.chip[data-i]'); if (!b) return;
    longDone = false;
    t = setTimeout(() => { longDone = true; openFav(+b.dataset.i); }, 600);
  });
  ['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(ev => el.addEventListener(ev, e => { if (ev !== 'pointermove' || Math.abs(e.movementX) + Math.abs(e.movementY) > 6){ clearTimeout(t); } }));
  el.addEventListener('click', e => { if (longDone){ e.stopImmediatePropagation(); longDone = false; } }, true);
  el.addEventListener('contextmenu', e => { const b = e.target.closest('.chip[data-i]'); if (b){ e.preventDefault(); openFav(+b.dataset.i); } });
}

/* Pantalla completa para escribir el destino */
function openSearch(){
  $('#searchView').classList.add('on');
  const i = $('#dest'); i.value = ''; suggSeq++; i.focus();   // dentro del toque, así el iPhone abre el teclado
  showHist();                                                  // arranca vacío con tus últimas búsquedas
}
function closeSearch(){ $('#dest').blur(); $('#searchView').classList.remove('on'); }
$('#openSearch').onclick = openSearch;
$('#searchClose').onclick = closeSearch;
$('#searchClear').onclick = () => { $('#dest').value = ''; suggSeq++; showHist(); $('#dest').focus(); };
function setSearchLabel(t){ $('#openSearchTx').textContent = t || '¿A dónde vas?'; $('#openSearch').classList.toggle('has', !!t); }
$('#searchForm').onsubmit = e => {
  e.preventDefault();
  const v = $('#dest').value.trim(); if (!v) return;
  if (suggs.length && !suggs[0].hist){ pickSugg(0); return; }
  addHist({name:v}); closeSearch(); route(v);
};

/* ---------- Sugerencias mientras escribís ---------- */
let suggs = [], suggTimer, suggSeq = 0;
const PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const SHOP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9h16l-1 11H5zM8 9V7a4 4 0 0 1 8 0v2"/></svg>';
const CAT = {'cafe':'Café','café':'Café','restaurant':'Restaurante','fast food':'Comida rápida','pub':'Bar','bar':'Bar','petrol station':'Estación de servicio','gas station':'Estación de servicio','parking garage':'Estacionamiento','open parking area':'Estacionamiento','hospital':'Hospital','pharmacy':'Farmacia','supermarkets & hypermarkets':'Supermercado','shop':'Comercio','hotel':'Hotel','college/university':'Universidad','school':'Escuela','bank':'Banco','atm':'Cajero','shopping center':'Shopping','stadium':'Estadio','park':'Parque','gym':'Gimnasio','bakery':'Panadería','ice cream parlor':'Heladería','pizza':'Pizzería','latin american':'Restaurante','grill':'Parrilla','steak house':'Parrilla','railroad station':'Estación de tren','metro station':'Estación de subte','bus stop':'Parada de colectivo','airport':'Aeropuerto','clothing shop':'Ropa','doctor':'Médico','dentist':'Dentista','church':'Iglesia','museum':'Museo','cinema':'Cine','theater':'Teatro'};
const CATRX = [[/cloth|fashion|boutique/, 'Ropa'], [/shoe|footwear/, 'Calzado'], [/jewel/, 'Joyería'], [/restaurant|food/, 'Restaurante'], [/caf/, 'Café'], [/bar|pub/, 'Bar'], [/shop|store|retail/, 'Comercio'], [/hotel|hostel/, 'Hotel'], [/hospital|clinic/, 'Salud'], [/school|university|college/, 'Educación'], [/parking/, 'Estacionamiento'], [/fuel|petrol|gas station/, 'Estación de servicio'], [/bank|atm/, 'Banco'], [/park|garden/, 'Parque'], [/gym|fitness|sport/, 'Deporte'], [/pharma|chemist/, 'Farmacia'], [/supermarket|grocery/, 'Supermercado'], [/bakery/, 'Panadería'], [/museum|gallery/, 'Museo'], [/church|place of worship/, 'Iglesia']];
const catEs = c => { const k = (c || '').toLowerCase(); if (CAT[k]) return CAT[k]; for (const [rx, es] of CATRX) if (rx.test(k)) return es; return c ? c[0].toUpperCase() + c.slice(1) : ''; };
function hideSugg(){ suggs = []; $('#sugg').innerHTML = ''; }
/* Historial de búsquedas (queda guardado aunque cierres la app) */
const CLOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
let hist = store.get('hist', []);
function addHist(s){
  const it = {name:s.name, addr:s.addr || '', cat:s.cat || '', isPoi:!!s.isPoi, pos:s.pos || null};
  const k = norm(it.name + ' ' + it.addr);
  hist = [it, ...hist.filter(h => norm(h.name + ' ' + h.addr) !== k)].slice(0, 15);
  store.set('hist', hist);
}
function showHist(){
  suggs = hist.map(h => ({...h, hist:true, dist:(me && h.pos) ? hav([me.lat, me.lng], [h.pos.lat, h.pos.lng]) : null}));
  $('#sugg').innerHTML = suggs.length ? `<div class="histHd"><span>Recientes</span><button type="button" class="histClr" data-clr="1">Borrar historial</button></div>` + suggs.map((s, i) => `<button type="button" role="option" data-i="${i}">
      <span class="ic">${CLOCK}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="km">${s.dist != null ? fmtKm(Math.round(s.dist)) : ''}</span>
      <span class="ad">${esc([s.cat, s.addr].filter(Boolean).join(' · '))}</span>
    </button>`).join('') : '';
}
/* Lugares corregidos a mano: nombre real y dirección verificada */
const MY_PLACES = [
  {name:'Zadig & Voltaire Vintage', addr:'El Salvador 4701, Palermo Soho, CABA', cat:'Ropa', alias:['zadig', 'voltaire', 'sadig', 'zadig vintage']}
];
const norm = t => (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/&/g, ' ').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const placeCache = {};
async function myPlaceHits(q){
  const nq = norm(q);
  const hits = MY_PLACES.filter(p => [p.name, ...p.alias].some(a => { const na = norm(a); return na.startsWith(nq) || nq.startsWith(na) || na.includes(nq); }));
  const out = [];
  for (const p of hits){
    if (!placeCache[p.name]){
      try{
        const d = await (await fetch(`${T}/search/2/geocode/${encodeURIComponent(p.addr + ', Argentina')}.json?key=${encodeURIComponent(apiKey)}&limit=1`)).json();
        const r = d.results?.[0]; if (r) placeCache[p.name] = {lat:r.position.lat, lng:r.position.lon};
      }catch{}
    }
    const pos = placeCache[p.name]; if (!pos) continue;
    out.push({name:p.name, addr:p.addr, cat:p.cat, isPoi:true, pos, dist:me ? hav([me.lat, me.lng], [pos.lat, pos.lng]) : null});
  }
  return out;
}
/* Segunda fuente de nombres: OpenStreetMap (Photon), suele tener los locales con el nombre correcto */
async function photonHits(q){
  const lat = me ? me.lat : -34.6037, lon = me ? me.lng : -58.3816;
  try{
    const d = await (await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=${lat}&lon=${lon}&limit=6&lang=default`)).json();
    return (d.features || []).filter(f => f.properties?.name && hav([lat, lon], [f.geometry.coordinates[1], f.geometry.coordinates[0]]) < 300000).map(f => {
      const pr = f.properties, pos = {lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]};
      const street = [pr.street, pr.housenumber].filter(Boolean).join(' ');
      const isPoi = !['house', 'street', 'city', 'district', 'locality', 'county', 'state'].includes(pr.type) && pr.osm_key !== 'highway' && pr.osm_key !== 'place';
      return {name:pr.name, addr:[street, pr.district || pr.city, pr.state].filter(Boolean).join(', '), cat:isPoi ? catEs((pr.osm_value || '').replace(/_/g, ' ')) : '', isPoi, pos, dist:me ? hav([me.lat, me.lng], [pos.lat, pos.lng]) : null};
    });
  }catch{ return []; }
}
async function loadSugg(q, fav){
  const seq = fav ? ++favSeq : ++suggSeq;
  const bias = me ? `&lat=${me.lat}&lon=${me.lng}` : '&lat=-34.6037&lon=-58.3816';
  try{
    const [mine, tt, ph] = await Promise.all([
      myPlaceHits(q),
      fetch(`${T}/search/2/search/${encodeURIComponent(q)}.json?key=${encodeURIComponent(apiKey)}&typeahead=true&limit=8&language=es-419${bias}`).then(r => r.json()).catch(() => ({})),
      photonHits(q)
    ]);
    if (seq !== (fav ? favSeq : suggSeq)) return;
    const fromTT = (tt.results || []).map(x => {
      const a = x.address || {};
      const poi = x.poi?.name;
      const street = [a.streetName, a.streetNumber].filter(Boolean).join(' ');
      return {
        name: poi || street || a.freeformAddress || q,
        addr: poi ? (a.freeformAddress || '') : [a.municipalitySubdivision || a.municipality, a.countrySubdivision].filter(Boolean).join(', '),
        cat: poi ? catEs(x.poi.categories?.[0] || '') : '',
        dist: x.dist, isPoi: !!poi,
        pos: {lat:x.position.lat, lng:x.position.lon}
      };
    });
    // mezclo: mis lugares primero, después los que más se parecen a lo escrito; saco repetidos
    const nq = norm(q);
    const score = s => (norm(s.name).includes(nq) ? 0 : 1) * 1e6 + (s.dist ?? 5e5);
    const all = [...mine, ...[...fromTT, ...ph].sort((a, b) => score(a) - score(b))];
    const list = [];
    for (const s of all){
      if (list.some(o => hav([o.pos.lat, o.pos.lng], [s.pos.lat, s.pos.lng]) < 60 && (norm(o.name).includes(norm(s.name).split(' ')[0]) || norm(s.name).includes(norm(o.name).split(' ')[0])))) continue;
      list.push(s);
      if (list.length >= 8) break;
    }
    if (fav) favSuggs = list; else suggs = list;
    $(fav ? '#favSugg' : '#sugg').innerHTML = list.map((s, i) => `<button type="button" role="option" data-i="${i}">
      <span class="ic">${s.isPoi ? SHOP : PIN}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="km">${s.dist != null ? fmtKm(Math.round(s.dist)) : ''}</span>
      <span class="ad">${esc([s.cat, s.addr].filter(Boolean).join(' · '))}</span>
    </button>`).join('');
  }catch{}
}
function pickSugg(i){
  const s = suggs[i]; if (!s) return;
  const label = s.isPoi ? `${s.name}, ${s.addr}` : `${s.name}${s.addr ? ', ' + s.addr : ''}`;
  $('#dest').value = label;
  addHist(s);
  hideSugg();
  closeSearch();
  route(label, s.pos || undefined);
}
$('#dest').addEventListener('input', () => {
  clearTimeout(suggTimer);
  const q = $('#dest').value.trim();
  if (q.length < 3 || !apiKey){ clearTimeout(suggTimer); suggSeq++; if (!q) showHist(); else hideSugg(); return; }
  suggTimer = setTimeout(() => loadSugg(q), 280);

function bigger(ts, f){
  if (typeof ts === 'number') return ts * f;
  if (ts && ts.stops) return {...ts, stops:ts.stops.map(([z, v]) => [z, v * f])};
  if (Array.isArray(ts) && ts[0] === 'interpolate') return ts.map((v, i) => i >= 4 && i % 2 === 0 && typeof v === 'number' ? v * f : v);

/* Día o noche según la salida y puesta del sol donde estás */
function sunTimes(lat, lng, d = new Date()){
  const rad = Math.PI / 180, day = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
  const decl = 23.44 * Math.sin(rad * (360 / 365) * (day - 81));
  const cosH = (Math.sin(-0.833 * rad) - Math.sin(lat * rad) * Math.sin(decl * rad)) / (Math.cos(lat * rad) * Math.cos(decl * rad));
  if (cosH > 1) return null; if (cosH < -1) return null;
  const H = Math.acos(cosH) / rad / 15;                       // horas desde el mediodía solar
  const B = rad * (360 / 365) * (day - 81);
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);   // ecuación del tiempo (min)
  const noonUTC = 12 - lng / 15 - eot / 60;
  const base = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return {rise:new Date(base + (noonUTC - H) * 3600e3), set:new Date(base + (noonUTC + H) * 3600e3)};
}

  const lat = me ? me.lat : -34.6, lng = me ? me.lng : -58.4, now = new Date();

  return now < t.rise || now > t.set;
}

function startGps(){

  let first = true;

    if (nav && nav.sim) return;

    const h = p.coords.heading;
    {
      const t = Date.now();
      let v = p.coords.speed;                                   // m/s
      const acc = p.coords.accuracy || 15;
      // guardo las posiciones de los últimos 6 segundos para calcular la velocidad yo, si el GPS no la da
      spdHist.push({lat:me.lat, lng:me.lng, t}); while (spdHist.length && t - spdHist[0].t > 6000) spdHist.shift();
      if (v == null || isNaN(v) || v < 0){

          const d = hav([o.lat, o.lng], [me.lat, me.lng]);
          // si te moviste menos que el margen de error del GPS, es ruido: estás quieto
          v = d < Math.max(8, acc * 0.8) ? 0 : d / ((t - o.t) / 1000);
        }
        else if (spdHist.length === 1) v = null;
      }
      if (v != null){
        let kmh = v * 3.6;
        if (acc > 25 && kmh < 12) kmh = 0;                     // señal mala y velocidad baja: no confío
        const thr = mySpeed > 0 ? 4 : 7;                        // para arrancar a marcar pide algo más (evita que salte quieto)
        mySpeed = kmh < thr ? 0 : (mySpeed ? mySpeed * 0.4 + kmh * 0.6 : kmh);

    else if (lastFix && hav([lastFix.lat, lastFix.lng], [me.lat, me.lng]) > 6) myHeading = bearing([lastFix.lat, lastFix.lng], [me.lat, me.lng]);
    if (!lastFix || hav([lastFix.lat, lastFix.lng], [me.lat, me.lng]) > 6) lastFix = me;
    if (!nav){ setMe([me.lat, me.lng], headingNow()); driveUpdate(); }

}

/* ---------- Límites de velocidad de OpenStreetMap (todo el mundo) ---------- */
const MPH = new Set(['US', 'GB', 'LR', 'MM', 'PR', 'VI', 'GU', 'AS', 'MP', 'BS', 'BZ', 'KY', 'VG', 'FK', 'AG', 'DM', 'GD', 'LC', 'VC', 'KN', 'MS', 'TC', 'AI', 'WS']);
let useMph = false;
function setCountry(cc){
  curCountry = cc;
  useMph = MPH.has(cc);
  document.querySelectorAll('.speed small').forEach(e => e.textContent = useMph ? 'mph' : 'km/h');
}
const U = kmh => useMph ? Math.round(kmh / 1.609) : Math.round(kmh);
const osmTiles = new Map();   // "la:ln" -> {ways:[...]} | 'loading' | {fail:time}
let osmBusy = 0;
const OG = .01;
function parseMax(v){
  if (!v) return null;
  const m = String(v).trim().match(/^(\d+(?:\.\d+)?)\s*(mph)?/i);
  if (!m) return null;
  return Math.round(+m[1] * (m[2] ? 1.609 : 1));
}
async function osmLoadTile(la, ln){
  const key = la + ':' + ln, cur = osmTiles.get(key);
  if (cur === 'loading' || (cur && cur.ways) || (cur && cur.fail && Date.now() - cur.fail < 60000)) return;
  if (osmBusy >= 2) return;
  osmTiles.set(key, 'loading'); osmBusy++;
  const bb = [la*OG, ln*OG, (la+1)*OG, (ln+1)*OG].map(v => v.toFixed(4)).join(',');
  const q = `[out:json][timeout:25];way(${bb})["highway"]["maxspeed"];out tags geom;`;
  let list = null;
  for (const url of OVERPASS){
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
      const res = await fetch(url + '?data=' + encodeURIComponent(q), {signal:ctl.signal});
      clearTimeout(t);
      if (!res.ok) continue;
      list = (await res.json()).elements || [];
      break;
    }catch{}
  }
  osmBusy--;
  if (!list){ osmTiles.set(key, {fail:Date.now()}); return; }
  const ways = [];
  for (const w of list){
    const v = parseMax(w.tags?.maxspeed);
    if (!v || !w.geometry) continue;
    ways.push({v, pts:w.geometry.map(g => [g.lat, g.lon])});
  }
  osmTiles.set(key, {ways});
  try{ sessionStorage.setItem('osm:' + key, JSON.stringify(ways)); }catch{}
}
function osmPrefetch(lat, lng){
  const la = Math.floor(lat / OG), ln = Math.floor(lng / OG);
  for (const [a, b] of [[0,0],[0,1],[0,-1],[1,0],[-1,0]]){
    const key = (la+a) + ':' + (ln+b);
    if (!osmTiles.has(key)){
      try{ const c = sessionStorage.getItem('osm:' + key); if (c){ osmTiles.set(key, {ways:JSON.parse(c)}); continue; } }catch{}
    }
    if (a === 0 && b === 0) osmLoadTile(la+a, ln+b); else setTimeout(() => osmLoadTile(la+a, ln+b), 1500);
  }
}
function osmLimitAt(p, heading){
  const la = Math.floor(p[0] / OG), ln = Math.floor(p[1] / OG);
  const k = Math.PI / 180, kx = 111320 * Math.cos(p[0]*k), ky = 110540;
  let best = null, bestScore = 22;
  for (const [a, b] of [[0,0],[0,1],[0,-1],[1,0],[-1,0]]){
    const t = osmTiles.get((la+a) + ':' + (ln+b));
    if (!t || !t.ways) continue;
    for (const w of t.ways){
      for (let i = 0; i < w.pts.length - 1; i++){
        const A = w.pts[i], B = w.pts[i+1];
        const ax = (A[1]-p[1])*kx, ay = (A[0]-p[0])*ky, dx = (B[1]-A[1])*kx, dy = (B[0]-A[0])*ky;
        const L2 = dx*dx + dy*dy; if (!L2) continue;
        const tt = Math.max(0, Math.min(1, -(ax*dx + ay*dy) / L2));
        const d = Math.hypot(ax + tt*dx, ay + tt*dy);
        if (d > 22) continue;
        let diff = Math.abs(((bearing(A, B) - heading) % 180 + 180) % 180);
        diff = Math.min(diff, 180 - diff);
        const score = d + diff / 4;
        if (score < bestScore){ bestScore = score; best = w.v; }
      }
    }
  }
  return best;
}

/* Corrige el dato de TomTom con la ley de tránsito (Ley 24.449 / CABA): calles 40, avenidas 60.
   Si TomTom marca un límite menor en una calle (zona escolar, 20 o 30), se respeta. */
function fixLimit(tt, street){
  if (curCountry !== 'AR') return tt || null;
  const s = (street || '').toLowerCase().trim();
  if (/^(autopista|au\b|au\.|acceso|ruta|autov[ií]a|camino)/.test(s)) return tt || null;
  if (/^(avenida|av\.|av\b|avda)/.test(s)) return tt && tt > 60 ? tt : 60;
  if (!s) return tt || null;
  return tt && tt <= 40 ? tt : 40;
}
async function driveUpdate(){

      ttLim = isNaN(v) ? null : Math.round(v);
    }catch{}
  }
  osmPrefetch(me.lat, me.lng);

async function geocode(q){
  const u = `${T}/search/2/search/${encodeURIComponent(q)}.json?key=${encodeURIComponent(apiKey)}&limit=1&language=es-419&lat=${me.lat}&lon=${me.lng}`;
  const r = await fetch(u); const d = await r.json();

  };
  meAnim = requestAnimationFrame(step);
  return dur;
}
let meAnim = 0, meCur = null, meRot = 0, lastSetT = 0;
/* ---------- Brújula: sin navegar (o parado), la flecha apunta para donde apuntás el celular ---------- */
let compassDeg = null, compassT = 0, compassOn = false;
function onOri(e){
  let h = e.webkitCompassHeading;                               // iPhone
  if (h == null && e.absolute && e.alpha != null) h = 360 - e.alpha; // Android
  if (h == null || isNaN(h)) return;
  const so = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  compassDeg = (h + so + 360) % 360; compassT = Date.now();
}
function startCompass(){
  if (compassOn) return; compassOn = true;
  if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onOri);
  addEventListener('deviceorientation', onOri);
}
if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function'){
  // el iPhone pide permiso la primera vez que tocás la pantalla
  const ask = () => {
    DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') startCompass(); }).catch(() => {});
    removeEventListener('touchend', ask); removeEventListener('click', ask);
  };
  addEventListener('touchend', ask); addEventListener('click', ask);
} else if (window.DeviceOrientationEvent) startCompass();
const compassActive = () => compassDeg != null && Date.now() - compassT < 2000 && !nav && mySpeed < 8;
function headingNow(){ return compassActive() ? compassDeg : myHeading; }
setInterval(() => {
  if (!meMarker || !compassActive() || nav) return;
  const d = ((compassDeg - meRot) % 360 + 540) % 360 - 180;
  if (Math.abs(d) < 1.5) return;
  meRot += d * 0.3;                                             // giro suave, sin temblar
  meMarker.setRotation(meRot);
}, 60);
function follow(pt, deg, dur){
  map.easeTo({center:ll2(pt), zoom:17.2, pitch:50, bearing:nav && nav.headUp ? deg : map.getBearing(),
    duration:dur || 650, easing:t => t, offset:[0, Math.round(innerHeight * .18)]});
}
/* Íconos de maniobra (dibujo propio): flecha blanca gruesa */
const MAN_PATHS = {
  straight:'<path d="M32 54V12"/><path d="M18 25L32 11l14 14"/>',
  right:'<path d="M18 56V34a12 12 0 0 1 12-12h22"/><path d="M42 11l12 11-12 11"/>',
  slight:'<path d="M22 56V36c0-6 3-10 8-14l16-12"/><path d="M33 8h15v15"/>',
  sharp:'<path d="M20 12v24a10 10 0 0 0 10 10h4l18-14"/><path d="M38 28h15v15"/>',
  uturn:'<path d="M42 56V26a12 12 0 0 0-24 0v20"/><path d="M8 36l10 12 10-12"/>',
  round:'<circle cx="32" cy="28" r="10"/><path d="M32 56V38"/><path d="M40 22l12-10"/><path d="M42 10h11v11"/>',
  arrive:'<path d="M20 56V10"/><path d="M20 12h26l-6 9 6 9H20"/>'
};
function maneuverSvg(man){
  const m = man || '';
  let k = 'straight', flip = false;
  if (/ARRIVE/.test(m)) k = 'arrive';
  else if (/UTURN/.test(m)) k = 'uturn';
  else if (/ROUNDABOUT/.test(m)) k = 'round';
  else if (/SHARP/.test(m)) k = 'sharp';
  else if (/BEAR|KEEP|EXIT|MOTORWAY|FREEWAY|HIGHWAY|SWITCH/.test(m)) k = 'slight';
  else if (/TURN_LEFT|TURN_RIGHT/.test(m)) k = 'right';
  if (/LEFT/.test(m) && k !== 'uturn') flip = true;
  if (k === 'uturn' && /RIGHT/.test(m)) flip = true;
  return `<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"${flip ? ' style="transform:scaleX(-1)"' : ''}>${MAN_PATHS[k]}</svg>`;
}
const ANG = {TURN_LEFT:-90, TURN_RIGHT:90, SHARP_LEFT:-135, SHARP_RIGHT:135, BEAR_LEFT:-45, BEAR_RIGHT:45,
  KEEP_LEFT:-30, KEEP_RIGHT:30, MAKE_UTURN:-180, TRY_MAKING_UTURN:-180, ENTER_MOTORWAY:30, ENTER_FREEWAY:30,
  ENTER_HIGHWAY:30, TAKE_EXIT:30, MOTORWAY_EXIT_LEFT:-30, MOTORWAY_EXIT_RIGHT:30, ROUNDABOUT_LEFT:-90,
  ROUNDABOUT_RIGHT:90, ROUNDABOUT_BACK:-180, SWITCH_PARALLEL_ROAD:30, SWITCH_MAIN_ROAD:-30};
const fmtDist = d => d >= 1000 ? `${(d/1000).toFixed(1).replace('.', ',')} km` : `${Math.max(0, Math.round(d/10)*10)} m`;
const sayDist = d => d >= 1000 ? `${(d/1000).toFixed(1).replace('.', ',')} kilómetros` : `${Math.round(d/50)*50} metros`;

function say(t){
  if (!voiceOn || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'es-AR';
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch{}
}

function locate(r, p, from, all){
  const k = Math.PI / 180, kx = 111320 * Math.cos(p[0]*k), ky = 110540;
  const a0 = all ? 0 : Math.max(0, from - 10), a1 = all ? r.path.length - 2 : Math.min(r.path.length - 2, from + 200);
  let best = {d:Infinity, i:a0, t:0};
  for (let i = a0; i <= a1; i++){
    const A = r.path[i], B = r.path[i+1];
    const ax = (A[1]-p[1])*kx, ay = (A[0]-p[0])*ky, dx = (B[1]-A[1])*kx, dy = (B[0]-A[0])*ky;
    const L2 = dx*dx + dy*dy;
    const t = L2 ? Math.max(0, Math.min(1, -(ax*dx + ay*dy) / L2)) : 0;
    const d = Math.hypot(ax + t*dx, ay + t*dy);
    if (d < best.d) best = {d, i, t};
  }
  if (best.d === Infinity) return {i:0, along:0, off:0};
  return {i:best.i, along:r.cum[best.i] + best.t * (r.cum[best.i+1] - r.cum[best.i]), off:best.d};
}

function posAt(r, s){
  let i = 0;
  while (i < r.cum.length - 2 && r.cum[i+1] < s) i++;
  const seg = r.cum[i+1] - r.cum[i] || 1, t = Math.min(1, Math.max(0, (s - r.cum[i]) / seg));
  const A = r.path[i], B = r.path[i+1] || A;
  return {lat:A[0] + (B[0]-A[0])*t, lng:A[1] + (B[1]-A[1])*t};
}

function navUpdate(p){
  if (!nav) return;
  const r = nav.r, pt = [p.lat, p.lng];
  const loc = locate(r, pt, nav.idx);
  if (loc.off > 50){ if (++nav.offCount >= 3 && !nav.rerouting && !nav.sim) reroute(p); }
  else nav.offCount = 0;
  nav.idx = loc.i;

  const total = r.cum[r.cum.length - 1] || 1, scale = r.dist / total;
  const done = loc.along * scale, rest = Math.max(0, r.dist - done);

  if (rest < 25 && !nav.arrived){
    nav.arrived = true;
    $('#navDist').textContent = '';
    $('#navMsg').textContent = 'Llegaste a destino';
    $('#navSub').textContent = '';
    $('#navThen').textContent = '';
    $('#navArrow').innerHTML = maneuverSvg('ARRIVE');
    say('Llegaste a destino');
    la('navUpdate', {dest:lastDest, arrow:0, dist:'Llegaste', msg:'Llegaste a destino', eta:Date.now(), rest:'', limit:null, arrived:true});
    setTimeout(stopNav, 4000);
    return;
  }

  let k = r.instr.findIndex(g => g.off > done + 5);
  if (k < 0) k = r.instr.length - 1;
  const g = r.instr[k] || {off:r.dist, msg:'Seguí por la ruta', man:''};
  const dNext = Math.max(0, g.off - done);
  nav.dNext = dNext; nav.nextMan = g.man; nav.rest = rest;
  $('#navDist').textContent = fmtDist(dNext);
  // como Waze: arriba la calle en grande; si no hay nombre, la indicación
  $('#navMsg').textContent = g.street || g.msg;
  $('#navSub').textContent = g.street ? g.msg : '';
  const n = r.instr[k+1];
  $('#navThen').textContent = n && n.off - g.off < 250 ? 'Después: ' + (n.street || n.msg) : '';
  if (nav.manShown !== g.man){ $('#navArrow').innerHTML = maneuverSvg(g.man); nav.manShown = g.man; }

  // límite de velocidad y velocidad actual
  const limTT = r.limits.find(z => loc.i >= z.s && loc.i < z.e);
  let curStreet = '';
  for (const g2 of r.instr){ if (g2.pi != null && g2.pi <= loc.i){ if (g2.street) curStreet = g2.street; } else if (g2.pi > loc.i) break; }
  osmPrefetch(pt[0], pt[1]);
  { const ahead = posAt(r, Math.min(loc.along + 800, r.cum[r.cum.length - 1])); osmPrefetch(ahead.lat, ahead.lng); }
  const segA = r.path[loc.i], segB = r.path[loc.i + 1] || segA;
  const limV = nav.curLimit = travelMode !== 'car' ? null : osmLimitAt(pt, segA === segB ? myHeading : bearing(segA, segB)) || fixLimit(limTT ? limTT.v : null, curStreet);
  const lim = limV ? {v:limV} : null;
  const limEl = $('#navLimit');
  if (lim){ limEl.textContent = U(lim.v); limEl.classList.remove('none'); } else limEl.classList.add('none');
  const spd = Math.round(nav.sim ? nav.simV * 3.6 : mySpeed);
  $('#navSpeed').textContent = U(spd);
  const over = lim && spd > lim.v + 3;
  $('#navSpeedBox').classList.toggle('over', !!over);
  if (over && Date.now() - (nav.overSaid || 0) > 30000){ say(`Cuidado, el límite es ${U(lim.v)}`); nav.overSaid = Date.now(); }

  // radares
  const cam = travelMode !== 'car' ? null : r.cams.find(c => c.along > loc.along - 10);
  const radarEl = $('#navRadar');
  if (cam){
    const dc = (cam.along - loc.along) * scale;
    if (dc < 600){
      radarEl.textContent = `RADAR a ${fmtDist(dc)}${cam.max ? ' · ' + cam.max + ' km/h' : ''}`;
      radarEl.classList.add('on');
      if (!cam.said && dc > 60){ cam.said = true; say(`Radar a ${sayDist(dc)}${cam.max ? ', máxima ' + cam.max : ''}`); }
    } else radarEl.classList.remove('on');
  } else radarEl.classList.remove('on');

  const secs = r.dur * rest / r.dist;
  if (iosBridge && (Date.now() - (nav.laT || 0) > 2500 || nav.laK !== k)){
    la(nav.laOn ? 'navUpdate' : 'navStart', {dest:lastDest, arrow:ANG[g.man] || 0, dist:fmtDist(dNext), msg:g.msg,
      eta:Date.now() + secs * 1000, rest:`${fmtMin(secs)} · ${fmtKm(Math.round(rest))}`, limit:lim ? U(lim.v) : null, arrived:false});
    nav.laOn = true; nav.laT = Date.now(); nav.laK = k;
  }
  $('#navEta').innerHTML = '<span class="lbl">Llegás </span>' + fmtHora(new Date(Date.now() + secs * 1000));
  $('#navRest').textContent = `${fmtMin(secs)} · ${fmtKm(Math.round(rest))}`;

  const st = nav.spoken[k] || 0;
  if (dNext <= 450 && dNext > 120 && st < 1){ say(`En ${sayDist(dNext)}, ${g.msg}`); nav.spoken[k] = 1; }
  else if (dNext <= 45 && st < 2){ say(g.msg); nav.spoken[k] = 2; }

  const A = r.path[loc.i], B = r.path[loc.i + 1] || A;
  const deg = A === B ? myHeading : bearing(A, B);
  // la flecha va pegada a la línea de la ruta (si estás a menos de 35 m de ella)
  const sp = loc.off < 35 ? posAt(r, loc.along) : null;
  const vis = sp ? [sp.lat, sp.lng] : pt;
  if (sp && Math.abs(loc.along - (nav.progAt ?? -99)) > 3){ setProgress(r, loc.i, vis); nav.progAt = loc.along; }
  const animDur = setMe(vis, deg);
  myHeading = deg;
  nav.last = {pt:vis, deg};
  if (nav.follow) follow(vis, deg, animDur);
}

function setNavRoute(r){
  nav.r = r; nav.idx = 0; nav.spoken = {}; nav.offCount = 0;
  loadCams(r);
  routes = [r]; sel = 0; draw();
}

async function reroute(p){
  nav.rerouting = true;
  $('#navMsg').textContent = 'Recalculando…';
  say('Recalculando');
  try{ const rs = await fetchRoutes(p, destPos, 0); if (nav) setNavRoute(rs[0]); }catch{}
  if (nav){ nav.rerouting = false; nav.offCount = 0; }
}

async function startNav(){
  if (!routes[sel] || !me) return;
  nav = {r:routes[sel], idx:0, spoken:{}, offCount:0, sim:null, rerouting:false, arrived:false, follow:true, headUp:true};
  routes = [nav.r]; sel = 0;
  loadCams(nav.r);
  document.body.classList.add('nav');
  draw();
  const first = nav.r.instr.find(g => g.off > 5);
  say('Iniciando navegación.' + (first ? ' ' + first.msg : ''));
  navUpdate(me);
  nav.timer = setInterval(async () => {
    if (!nav || nav.sim || nav.rerouting || !me) return;
    try{ const rs = await fetchRoutes(me, destPos, 0); if (nav && !nav.sim){ const sp = nav.spoken; setNavRoute(rs[0]); nav.spoken = sp; navUpdate(me); } }catch{}
  }, 180000);
  try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{}
}

$('#recenter').onclick = () => {
  if (!nav) return;
  nav.follow = true; nav.headUp = true;
  $('#recenter').classList.remove('on');
  if (nav.last) follow(nav.last.pt, nav.last.deg, 700);
};
/* Tránsito en la cuadra por donde vas (TomTom Traffic Flow) */
let flowT = 0, flowAt = null, flowBusy = false;
async function flowCheck(pt){
  const pill = $('#flowPill');
  if (travelMode !== 'car'){ pill.classList.remove('on'); return; }
  if (flowBusy) return;
  if (flowAt && Date.now() - flowT < 20000 && hav(flowAt, pt) < 150) return;   // cada 20 s o cada 150 m
  flowBusy = true; flowT = Date.now(); flowAt = pt;
  try{
    const d = await (await fetch(`${T}/traffic/services/4/flowSegmentData/relative0/15/json?point=${pt[0]},${pt[1]}&unit=KMPH&key=${encodeURIComponent(apiKey)}`)).json();
    const f = d.flowSegmentData;
    if (!f || !nav){ pill.classList.remove('on'); return; }
    let label, color;
    if (f.roadClosure){ label = 'Calle cortada'; color = '#7a0000'; }
    else {
      const ratio = f.freeFlowSpeed ? f.currentSpeed / f.freeFlowSpeed : 1;
      if (ratio >= 0.75){ label = 'Tránsito fluido'; color = '#2ecc71'; }
      else if (ratio >= 0.5){ label = 'Tránsito moderado'; color = '#ff9f1a'; }
      else if (ratio >= 0.25){ label = 'Tránsito pesado'; color = '#e6261f'; }
      else { label = 'Tránsito detenido'; color = '#7a0000'; }
      label += ` · ${U(f.currentSpeed)} ${useMph ? 'mph' : 'km/h'}`;
    }
    pill.querySelector('i').style.background = color;
    pill.querySelector('span').textContent = label;
    pill.classList.add('on');
  }catch{
  }finally{ flowBusy = false; }
}
function stopNav(){
  $('#flowPill').classList.remove('on'); flowAt = null;
  $('#recenter').classList.remove('on');
  if (!nav) return;
  clearInterval(nav.timer); clearInterval(nav.sim);
  la('navEnd', {});
  $('#navRadar').classList.remove('on');
  nav = null;
  document.body.classList.remove('nav');
  $('#navSim').textContent = '▶';
  try{ speechSynthesis.cancel(); }catch{}
  try{ wakeLock && wakeLock.release(); }catch{}
  wakeLock = null;
  clearRoutes();
  setStatus('Navegación terminada. Elegí otro destino.');
  if (me){ setMe([me.lat, me.lng], headingNow()); map.easeTo({center:[me.lng, me.lat], zoom:15, pitch:0, bearing:0, offset:[0, 0], duration:700}); }
}

function toggleSim(){
  if (!nav) return;
  if (nav.sim){ clearInterval(nav.sim); nav.sim = null; $('#navSim').textContent = '▶'; return; }
  let s = nav.r.cum[nav.idx] || 0, v = 0, cruise = .9 + Math.random() * .12, tLast = performance.now();
  nav.simV = 0;
  $('#navSim').textContent = '■';
  // simulación realista: acelera, va cerca del límite, frena en los giros y al llegar
  nav.sim = setInterval(() => {
    if (!nav) return;
    const now = performance.now(), dt = Math.min(.5, (now - tLast) / 1000); tLast = now;
    if (Math.random() < .02) cruise = .85 + Math.random() * .17;
    let target = travelMode === 'pedestrian' ? 1.4 * cruise : travelMode === 'bicycle' ? 4.5 * cruise : ((nav.curLimit || 40) / 3.6) * cruise;
    const turn = nav.nextMan && !/STRAIGHT|ARRIVE|DEPART|KEEP|BEAR|MOTORWAY|EXIT|FREEWAY|HIGHWAY/.test(nav.nextMan);
    if (turn && nav.dNext != null){
      const slow = 5.5;                       // ~20 km/h para doblar
      const brakeDist = (v*v - slow*slow) / (2 * 2.5) + 15;
      if (nav.dNext < Math.max(25, brakeDist)) target = Math.min(target, slow);
    }
    if (nav.rest != null){ const stopTarget = Math.sqrt(Math.max(0, 2 * 2.5 * (nav.rest - 8))); target = Math.min(target, stopTarget); }
    const acc = target > v ? 2.2 : -3;      // m/s² aceleración / frenado
    v = target > v ? Math.min(target, v + acc * dt) : Math.max(target, v + acc * dt);
    v = Math.max(0, v);
    nav.simV = v;
    s += v * dt;
    const total = nav.r.cum[nav.r.cum.length - 1];
    navUpdate(posAt(nav.r, Math.min(s, total)));
  }, 250);
}

$('#go').onclick = startNav;
$('#navExit').onclick = stopNav;
$('#navSim').onclick = toggleSim;
$('#navVoice').textContent = voiceOn ? '🔊' : '🔇';
$('#navVoice').onclick = () => {
  voiceOn = !voiceOn;
  store.set('voice', voiceOn);
  $('#navVoice').textContent = voiceOn ? '🔊' : '🔇';
  if (!voiceOn) try{ speechSynthesis.cancel(); }catch{}
};
document.addEventListener('visibilitychange', async () => {
  if (nav && document.visibilityState === 'visible'){ try{ wakeLock = await navigator.wakeLock?.request('screen'); }catch{} }
});

/* ---------- Dónde estacioné ---------- */
let parkMarker = null;
const getPark = () => store.get('park', null);
function drawPark(){
  const pk = getPark();
  if (parkMarker){ parkMarker.remove(); parkMarker = null; }
  $('#parkBox').classList.toggle('hidden', !pk);
  if (!pk) return;
  if (map){
    const el = document.createElement('div'); el.className = 'parkPin'; el.textContent = 'P';
    parkMarker = new maplibregl.Marker({element:el}).setLngLat([pk.lng, pk.lat]).addTo(map);
  }
  updateParkInfo();
}
function updateParkInfo(){
  const pk = getPark(); if (!pk) return;
  const mins = Math.round((Date.now() - pk.t) / 60000);
  const hace = mins < 1 ? 'recién' : mins < 60 ? `hace ${mins} min` : mins < 1440 ? `hace ${Math.floor(mins/60)} h ${mins%60} min` : `el ${new Date(pk.t).toLocaleDateString('es-AR', {day:'numeric', month:'short'})}`;
  const dist = me ? ' · a ' + fmtKm(Math.round(hav([me.lat, me.lng], [pk.lat, pk.lng]))) : '';
  $('#parkInfo').textContent = `Estacionado ${hace}${pk.addr ? ' · ' + pk.addr : ''}${dist}`;
}
async function savePark(auto, at){
  const pos = at || me;
  if (!pos){ if (!auto) setStatus('Todavía no tengo tu ubicación.'); return; }
  const old = getPark();
  if (auto && old && hav([old.lat, old.lng], [pos.lat, pos.lng]) < 60) return;   // ya estaba guardado ahí
  const pk = {lat:pos.lat, lng:pos.lng, t:Date.now(), addr:''};
  store.set('park', pk);
  drawPark();
  setStatus(auto ? 'Guardé automáticamente dónde estacionaste (P azul).' : 'Listo, guardé dónde estacionaste.');
  try{
    const d = await (await fetch(`${T}/search/2/reverseGeocode/${pk.lat},${pk.lng}.json?key=${encodeURIComponent(apiKey)}&radius=50`)).json();
    const a = d.addresses?.[0]?.address;
    if (a){ pk.addr = [a.streetName, a.streetNumber].filter(Boolean).join(' ') || a.freeformAddress || ''; store.set('park', pk); updateParkInfo(); }
  }catch{}
}
$('#btnPark').onclick = () => {
  const pk = getPark();
  if (!pk){ savePark(); return; }
  map && map.easeTo({center:[pk.lng, pk.lat], zoom:17, duration:600});
  $('#parkBox').classList.remove('hidden');
  updateParkInfo();
  setStatus('Tu auto está marcado con la P azul. Para guardar un lugar nuevo, tocá "Ya lo saqué" y después la P.');
};
$('#parkGo').onclick = () => {
  const pk = getPark(); if (!pk) return;
  $('#dest').value = 'Mi auto' + (pk.addr ? ', ' + pk.addr : '');
  route('Mi auto', {lat:pk.lat, lng:pk.lng}, {walk:true});
};
$('#parkDel').onclick = () => { store.set('park', null); drawPark(); setStatus('Listo, borré la ubicación del auto.'); };
setInterval(updateParkInfo, 60000);

/* Atajo del celular al desconectarse del Bluetooth del auto: abre la app con ?estacione */
const wantPark = /[?&](estacione|park)\b/.test(location.search);
if (wantPark){
  history.replaceState(null, '', location.pathname);
  const waitFix = setInterval(() => { if (me){ clearInterval(waitFix); savePark(false); say('Guardé dónde estacionaste'); } }, 500);
  setTimeout(() => clearInterval(waitFix), 60000);
}

/* ---------- Arranque ---------- */
let destPos = null;
renderChips();
if (!apiKey){
  setStatus('Primero cargá tu clave de TomTom en Ajustes (⚙).');
  openCfg();
} else if (typeof maplibregl === 'undefined'){
  setStatus('No cargó el mapa. Revisá tu conexión.');
} else {
  initMap();
}
}
